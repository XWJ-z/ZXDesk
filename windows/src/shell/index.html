<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; font-src 'self'"
    />
    <title>ZXDesk 工作台</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="screen-starting">
    <!-- 顶栏 = **纯文字菜单栏**：文件 / 查看 / 工具 / 帮助（Windows 规范四组，0.2.6 重排） -->
    <header id="menubar" class="menubar" hidden>
      <nav class="menu-group">
        <button class="menu-btn" type="button" data-menu="file">文件</button>
        <button class="menu-btn" type="button" data-menu="view">查看</button>
        <button class="menu-btn" type="button" data-menu="tools">工具</button>
        <button class="menu-btn" type="button" data-menu="help">帮助</button>
        <!-- 公告条：菜单栏里「帮助」之后的那一项（DSH 同位置）。
             宽度随内容、有上限，超长省略号；点开公告窗口看历史。 -->
        <button id="notice-bar" class="notice-bar" type="button" data-action="notice.open" hidden>
          <span id="notice-bar-text" class="notice-bar-text"></span>
        </button>
      </nav>
      <!-- 错误提示位（浏览模式）：视图盖住内容区，只有菜单栏这一条能看见 -->
      <div id="menu-error" class="menu-error" hidden>
        <span id="menu-error-text" class="menu-error-text"></span>
        <button class="menu-btn" type="button" data-action="error.retry">重试</button>
      </div>
      <div id="access-actions" class="menu-actions" hidden>
        <button class="menu-btn" type="button" data-action="flow.back">返回</button>
        <button class="menu-btn" type="button" data-action="access.reload">刷新</button>
        <button class="menu-btn primary" type="button" data-action="access.done">已输入完成</button>
      </div>
    </header>

    <main id="content" class="content" aria-live="polite"></main>

    <!-- 更新提示条：自动检查发现新版本时出现，点「查看」进更新页，「以后再说」只忽略这一版 -->
    <div id="update-banner" class="update-banner" hidden>
      <span id="update-banner-text" class="update-banner-text"></span>
      <button class="link-btn" type="button" data-action="update.open">查看</button>
      <button class="link-btn" type="button" data-action="update.skip">以后再说</button>
    </div>

    <div id="toast" class="toast" hidden></div>

    <!-- 「切换账号」弹窗（0.2.6）：连接页账号框旁的「切换」与「文件 → 切换账号」共用这一处。
         ⚠️ 打开时主进程会把远程视图藏起来 —— WebContentsView 永远画在 DOM 之上，不藏就被网页盖住。 -->
    <div id="modal" class="modal" hidden></div>

    <!-- ⚠️ 用**经典脚本**，不用 type="module"：file:// 下的 ES module 会被 Chromium 按
         「null origin + CORS」拦掉（表现就是壳一片空白、按钮全无反应）。
         壳不需要 import/export，踏实走经典脚本。 -->
    <script src="app.js" defer></script>
  </body>
</html>
