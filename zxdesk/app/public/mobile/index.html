<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#eef1f6" />
    <title>ZXDesk工作台</title>
    <script>
 /* 手机版入口守卫 —— 手机版就是手机版，与电脑版之间**没有切换按钮**。
         电脑用户不会走到 /mobile/ 来（电脑版页面自己会分流），手机用户也不需要去电脑版，
         所以这里不再有任何「自动弹走」的逻辑，唯一例外是应急出口：
           - ?view=desktop  明确要电脑版 → 带着参数去电脑版（界面上不出现，仅在设备判定出错时用）
           - ?view=mobile   留在手机版
         出问题时留在手机版。 */
      (function () {
        /* ⭐ 应用挂载前缀（0.3.5 统一网关改造）：见 desktop/index.html 里同款说明。
           ⚠️ 本页的资源地址一律写**相对路径**，且因为本页比应用根**深一层**，
             引用 `core/` 要用 `../core/` —— 网关前缀下绝对路径会打到飞牛系统根目录（404 ⇒ 白屏）。 */
        var base = location.pathname
          .replace(/[^/]*$/, '')
          .replace(/\/mobile\/$/, '')
          .replace(/\/$/, '');
        // 清掉旧版本写下的「已选电脑版」偏好键：本版本起两边都不再读写它
        try {
          localStorage.removeItem('zxdesk.view');
        } catch (e) {
          /* 存储不可用：无所谓，本来也不再依赖它 */
        }
        var q = null;
        try {
          q = new URLSearchParams(location.search).get('view');
        } catch (e) {
          q = null;
        }
        /* ⭐⭐ 2026-10-19：跳回电脑版时**也要把查询串带走**（只摘掉 `view`）——
           与 `index.html` 里 `carrySearch()` **逐字同一套理由**：飞牛网关的票据跟地址走，
           整页跳转丢掉 `location.search` 就会被重新弹访问码。
           ⚠️ 本函数在这里**只服务上面那一条应急出口**，但请与 `index.html` 那份保持在同一个样子
           （两处都改才叫一致 —— 只改一处的话，从手机版跳回电脑版那条路照样会丢票据）。 */
        function carrySearch() {
          var s = String(location.search || '');
          if (!s) return '';
          try {
            var usp = new URLSearchParams(s);
            usp.delete('view');
            var out = usp.toString();
            return out ? '?' + out : '';
          } catch (e) {
            return s;
          }
        }
        if (q === 'desktop') {
          var keep = carrySearch();
          location.replace(base + '/?view=desktop' + (keep ? '&' + keep.slice(1) : '') + location.hash);
        }
      })();
    </script>
    <!-- ⭐ 共用设计令牌（--zx-*）：必须在 mobile/app.css 之前（见 core/tokens.css 的说明）
         ⚠️ 资源地址一律**相对路径**，且本页深一层 ⇒ `core/` 要写成 `../core/`（见上方脚本里的说明） -->
    <link rel="stylesheet" href="../core/tokens.css" />
    <link rel="stylesheet" href="app.css" />
    <!-- ⭐ 0.9.1「关于我们 / 联系与反馈」两份底部抽屉的样式 —— 与电脑版**共用同一份**
         （`core/about.css`），本页深一层所以写 `../core/`。 -->
    <link rel="stylesheet" href="../core/about.css" />
  </head>
  <body>
    <div class="phone" id="phone">
      <!-- 顶栏：显示用，不放主操作（主操作在拇指区的 FAB / TabBar） -->
      <header class="topbar">
        <span class="tb-logo">ZX</span>
        <div class="tb-head">
          <h1 id="tb-title">今天</h1>
          <div class="tb-sub" id="tb-sub">正在读取…</div>
        </div>
        <button class="tb-btn" id="btn-refresh" type="button" aria-label="刷新数据">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" />
          </svg>
        </button>
      </header>

      <!-- 数据层异常横幅（只读降级 / 备份失败时出现，常驻不滚动） -->
      <div class="m-banner hidden" id="m-banner"></div>

      <!-- 四个标签各自的滚动容器（切换时保留滚动位置） -->
      <main id="app">
 <!-- ⭐ 「今天」0.4.5 起是**手机版的首页看板**（「首页看板这个得大改」）：
             区间切换条是**静态骨架**，只有 `#today-body` 由 `views/today.js` 重画 ——
             两个 `<input type="date">` 若进重画范围，用户正在挑日期的原生选择器会被连根换掉。
             ⚠️ 预设按钮的 `data-dash` 与 `core/dashboard.js` 的 `DASH_PRESETS` 逐个对齐。
 ⭐ 0.8.9：「今日」那一颗**已删** —— 它与周条右上角的「今天」
             按钮重复。现在只剩「单日 / 本周 / 本月」三颗，「回到今天」走周条那颗「今天」。

 ⭐⭐ 0.8.61：「首页看板…该固定的固定，不应该随着页面滑动而滑动，
             参考其它模块的设计」——这一屏改成**两段式**：上面这几块（胶囊 / 周条 / 筛选 / 搜索 /
             概览）是**固定段**，只有 `#today-body` 内部滚。做法与 `#view-board` / `#view-webpass`
             逐字同构（那两个屏是现成先例，见 `app.css` 各那一段）。
             ⚠️⭐ 判据：**控件与「一眼要看到的那几个数」固定，内容流滚**。看板的定位是
             「一览 + 进各模块」——顶部那几件一旦跟着滚走，翻到列表中部就既换不了区间、
             也切不了视图、还看不出今天几件事，看板就退化成一条列表。
             ⚠️ 改动边界只有这一屏：`.view` 那条公共规则（整屏滚）一个字没动，
             别的屏照旧（`#view-board` / `#view-webpass` / `#view-teamwork` 是各自覆盖的）。 -->
        <section class="view" id="view-today">
          <!-- ⭐ 0.8.7（方案 26）：视图胶囊 `列表视图 ｜ 日历视图` 的定位槽 —— 内容由
               `views/today.js` 的 `renderToday()` 写进来。
 ⚠️ 「把切换按钮放【首页看板】这个标题处」⇒ 它是这一屏的**第一行**；
               而且必须是**静态骨架**（⛔ 不能住在 `#today-body` 里）：那块每画一次就被整个换掉，
               而这条胶囊**两个视图下都得在**（列表 / 日历）。
               ⚠️ 手机端的「标题」是顶栏 `<header class="topbar">` 那行 —— 它是**全局固定栏**、
               还得同时装标题与副标题，塞不进一颗胶囊 ⇒ 落到这里（与电脑端「标题行」同一个位置感）。
               ⚠️ 没视图可切（模块被删 / 接线表里没人声明 `dashView`）时它**空着**，
               `.dash-tabs-row:empty` 会把占位收掉 —— 一颗死胶囊都不剩（删目录验收）。 -->
          <div class="dash-tabs-row" id="today-tabs"></div>
          <!-- ⭐ 0.5.5 区间条（周条）：一行「‹ 区间 › 今天」+ 一行 7 个日期格。
 「合并今日、单日、本周菜单（两端）：改为如图所示」。
               ⚠️ 与下面那套旧控件**驱动同一个 state**，两套必须同步（逻辑在 `views/today.js` 的
               `renderDashBar()`）：点格子把档位切到「单日」，点档位按钮把格子跟着挪。
               不同步的表现是「顶部写着 9/14 ~ 9/20、格子亮着 9/15、下面的 chip 亮着本月」，且不报错。
               ⚠️ 静态骨架：7 个格子是固定节点，只由 JS 改字与类名，不重建。 -->
          <div class="dash-week">
            <div class="dw-head">
              <button class="dw-nav" type="button" data-act="dash-week" data-delta="-1" aria-label="上一周">‹</button>
              <span class="dw-range" id="dash-week-range"></span>
              <button class="dw-nav" type="button" data-act="dash-week" data-delta="1" aria-label="下一周">›</button>
              <button class="dw-today" type="button" data-act="dash-today">今天</button>
 <!-- ⭐ 0.8.9：「这两个图标放到【今天】的旁边」（与电脑端同一步）——
                   筛选那颗控制下面那条 `.dash-range`（单日 / 本周 / 本月 ＋ 两个日期框），
                   放大镜那颗控制搜索行。⛔ 动作走本端的动作表（`data-act`），不在这里挂监听。 -->
              <button class="dw-ico" type="button" data-act="dash-panel" data-panel="filter" aria-label="筛选区间" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" /></svg>
              </button>
              <button class="dw-ico" type="button" data-act="dash-panel" data-panel="search" aria-label="搜索" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" /><path d="M16 16l4 4" /></svg>
              </button>
            </div>
            <div class="dw-days" id="dash-week-days" role="group" aria-label="按天查看">
              <button class="dash-day" type="button" data-act="dash-day" data-dash-day=""><i>一</i><b></b></button>
              <button class="dash-day" type="button" data-act="dash-day" data-dash-day=""><i>二</i><b></b></button>
              <button class="dash-day" type="button" data-act="dash-day" data-dash-day=""><i>三</i><b></b></button>
              <button class="dash-day" type="button" data-act="dash-day" data-dash-day=""><i>四</i><b></b></button>
              <button class="dash-day" type="button" data-act="dash-day" data-dash-day=""><i>五</i><b></b></button>
              <button class="dash-day" type="button" data-act="dash-day" data-dash-day=""><i>六</i><b></b></button>
              <button class="dash-day" type="button" data-act="dash-day" data-dash-day=""><i>日</i><b></b></button>
            </div>
          </div>
          <div class="dash-search" id="dash-search" hidden>
 <!-- ⭐ 0.8.9：放大镜点开就是这一行（与电脑端同一手法）。 -->
            <span class="ds-ico" aria-hidden="true">🔍</span>
            <input
              id="dash-q"
              name="q"
              type="search"
              placeholder="搜这段时间里的事项…"
              autocomplete="off"
              data-autofill-guard
              data-lpignore="true"
              data-1p-ignore
              data-bwignore="true"
            />
          </div>
          <div class="dash-range" hidden>
            <div class="chips" id="dash-presets">
              <button class="chip" type="button" data-act="dash-preset" data-dash="day">单日</button>
              <button class="chip" type="button" data-act="dash-preset" data-dash="week">本周</button>
              <button class="chip" type="button" data-act="dash-preset" data-dash="month">本月</button>
            </div>
            <div class="dash-dates">
              <input id="dash-from" type="date" aria-label="起始日期" />
              <span class="dash-dash">–</span>
              <input id="dash-to" type="date" aria-label="截止日期" />
            </div>
            <div class="dash-range-note" id="dash-range-note"></div>
          </div>
          <!-- ⭐⭐ 0.8.61：**任务概览**（五个数 + 进度）的固定槽 —— 从前它长在 `#today-body`
 里，跟着清单一起滚走。「该固定的固定」+「看板要一眼看得出
               今天几件事」，而概览那五个数还是**筛选按钮**（点一个就筛出这一类）——
               它滚没了，等于筛选入口也滚没了。
               ⚠️ 它是**空槽**：内容由 `views/today.js` 的 `renderStats()` 写进来，
               数据没到 / 空工作台时写空串（空 div 高 0，不占位）。
               ⚠️ 它住在 `#today-body` **外面** ⇒ 不参与内容重画，也不吃 `.dash-row` 那条淡入；
               `#today-body` 每画一次都不会把它连根换掉（里面是 5 颗按钮）⇒ 点下去不会丢焦点。
 ⚠️ 两个视图（列表 / 日历）共用这一份 —— 0.8.7 「日历视图也要有任务概览」。 -->
          <div id="today-stats"></div>
          <!-- ⭐⭐ 0.8.61：**唯一**的滚动区（两段式的那下半段）。从前这一屏是整屏滚，
               滚的是 `.view` 自己；现在 `.view` 改成 `overflow:hidden`，滚动落在这里。
               ⚠️⭐ 底部大留白（TabBar + FAB + 呼吸位）**跟着搬进这里** —— 外层改成
               `overflow:hidden` 之后，`.view` 那条 `padding-bottom` 在本屏**等于没效果**：
               漏了**不变红**，只是「最后一条被悬浮 ＋ 与 TabBar 盖住」（`#view-board` 记过同一条）。
               ⚠️ 滚动位置由这个容器自己记（`display:none` 期间不丢）—— 切标签回来还在原处，
               但**屏内切视图**要手动归零（见 `views/today.js` 的 `scrollTopToTop()`）。 -->
          <div id="today-body"></div>
        </section>
 <!-- ⭐ 0.5.2：「项目」视图已整块删除（「删除现在的项目视图」）——
             换项目 / 新建 / 编辑 / 删除项目全部收进「任务板」顶部（`renderBoard()` 的
             【项目 ▾】下拉与 ✎ / 🗑 按钮）；底部「项目」标签的位置让给了「对话」。
             ⭐ 0.8.7（方案 28）：**随手记并进了这一屏**（药丸「任务 ｜ 随手记」）——
             第一行那颗药丸是静态槽，`#board-main` 装任务板自己那一块，
             `#board-pane` 装模块（随手记）贡献的视图（由 `mountModuleSlot()` 动态挂）。
             ⚠️ 骨架从「全空」改成这三块：`renderBoard()` 从这一版起写 `#board-main`，
             ⛔ 不再是 `#view-board`（写它会把药丸与模块视图一起抹掉）。 -->
        <section class="view hidden" id="view-board">
          <div id="board-tabs"></div>
          <!-- ⭐ 0.8.15（方案 35）：`#board-main` 与 `#board-pane` 包进同一个 `.board-stage`
               （grid 同格 `grid-area: 1/1`）—— 交叉淡入期间两层重叠，旧的那层照常显示。
               ⚠️ 药丸（`#board-tabs`）**留在 stage 外面**：它是屏内静态槽，⛔ 不进这一格。 -->
          <div class="board-stage">
            <div id="board-main"></div>
            <div id="board-pane"></div>
          </div>
        </section>
        <!-- ⭐⭐ 0.8.13（方案 33）：**课表 / 番茄钟 / 行程三块并成一个模块** `time`「番茄钟与日程表」——
             底栏那一颗叫「日程」（`tab.name`），整屏由 `modules/time/home-mobile.js` 管：
             四个 pane（首页「日程表」+ 三个子屏）按 `state.timeTab` 显隐。
             ⚠️⚠️ 它们**不再各自进** `mobile/app.js` 的 `switchTab()` 视图数组 —— 屏名统一成 `time`
             （⛔ 留着旧名字 ⇒ `$('#view-timetable')` 回 null ⇒ 切屏当场抛）。
             ⚠️ 三个子屏的容器 id 与电脑端**同名**：`#time-timetable` / `#time-pomodoro` / `#time-trip`。 -->
        <section class="view hidden" id="view-time">
          <!-- ① 首页「日程表」：批 1 只放三颗进子屏的按钮，时间轴在批 3 画（`home-mobile.js`） -->
          <div id="time-home" class="time-pane"></div>

          <!-- ② 课表子屏：内容由 `modules/time/timetable-mobile.js` 的 `renderTimetable()` 整块画。
               ⚠️ 返回行在**外面**、内容画进 `#time-timetable-body` —— 否则这一屏每次重画都会抹掉返回键。 -->
          <div id="time-timetable" class="time-pane hidden">
            <div class="time-back-row" data-time-back="timetable"></div>
            <div id="time-timetable-body"></div>
          </div>

          <!-- ③ 番茄钟子屏：内容由 `modules/time/pomodoro-mobile.js` 的 `renderPomodoro()` 整块画（同上） -->
          <div id="time-pomodoro" class="time-pane hidden">
            <div class="time-back-row" data-time-back="pomodoro"></div>
            <div id="time-pomodoro-body"></div>
          </div>

          <!-- ④ 行程子屏：内容由 `modules/time/trip-mobile.js` 的 `renderTrip()` 整块画（同上） -->
          <div id="time-trip" class="time-pane hidden">
            <div class="time-back-row" data-time-back="trip"></div>
            <div id="time-trip-body"></div>
          </div>
        </section>
        <!-- ⭐ 0.8.7 网址/密码夹（方案 27）：**纯屏模块** —— 药丸 `网址 ｜ 密码` 切两个视图，
             按选择把 `bookmarks` / `vault` 的界面**动态挂**进 `#webpass-body`。
             ⚠️ 药丸是这一屏的**第一行**（手机端的标题在全局顶栏里，那行还要装标题 + 副标题 + 刷新键），
             ⛔ 不许放进 `#webpass-body` —— 后者每画一次就被整块换掉（「两个视图下都在」只有视图中立区做得到）。 -->
        <section class="view hidden" id="view-webpass">
          <div id="webpass-tabs"></div>
          <div id="webpass-body"></div>
 <!-- ⭐⭐ 0.8.17：「网址/密码库：新建的 + 图标，切换会跟随界面变化，
               这个应该是固定在界面上的（参考任务与随手记），两端都要改」——
               它从**两个视图片段**里搬到这里（静态层）：原先收藏夹一颗、密码库一颗，各长在
               自己那一份片段里 ⇒ 换视图时旧那颗跟着旧片段一起被清掉、新那颗再出现，
               看着就是「＋ 跟着界面变」。
               ⚠️ 必须住 `#webpass-body` **外面**（与药丸同一条纪律：后者每挂一次就被整块换掉）。
               ⚠️ 显隐与无障碍文案由 `modules/webpass/mobile.js` 的 `paintFab()` 按当前档位刷。 -->
          <button class="fab" id="webpass-new" type="button" title="新建" aria-label="新建">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </section>
        <!-- ⭐ 0.8.7（方案 28）：**随手记不再有自己的屏** —— 它并进了「任务板」那一屏
             （第一行药丸「任务 ｜ 随手记」）。骨架（检索框 + 「＋ 记一条」+ #idea-body）
             连同动作表 / 直连监听 / 弹层委托一起搬进了视图片段
             `modules/idea/mobile-board-pane.js`，由 `mountModuleSlot()` 挂进 `#board-pane`。
             ⛔ 别把这一屏加回来：留一半在这里 = 同一批 id 在文档里出现两遍，
             `document.getElementById` 只命中前一个 ⇒ 片段里那块界面**静默空白**（且不报错）。 -->
        <!-- ⭐⭐ 0.8.10 批 3（方案 30）：**数码管理不再有自己的屏**（原来那个 <section id="view-digital"> 已整块删掉）——
             它的骨架（页头计数与「＋ 新增」、概览行、搜索框、分类与排序下拉、列表）连同屏内
             事件委托一起搬进了视图片段 `modules/digital/mobile-assets-pane.js`，
             由 `core/slots.js` 的 `mountModuleSlot()` 挂进「个人资产管理」那一屏（槽名 `assets-pane`）。
             ⛔ 别把这一屏加回来：留一半在这里 = 同一批 id 在文档里出现两遍，
