<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZXDesk工作台</title>
    <script>
      /* 入口分流（电脑版页面）—— 手机版就是手机版，电脑版就是电脑版，界面上没有切换入口
 。这里只做一件事：看着像手机就送去 /mobile/。

         1) ?view=desktop  应急出口：强制留在电脑版（设备判定万一出错时用，界面上不出现）
         2) ?view=mobile   应急出口：强制去 /mobile/（想在电脑上预览手机版时用）
         3) 其余按设备判定 —— 触屏 → /mobile/，否则留在电脑版
         ⚠️ 判定必须「保守」：现在两边都没有切换按钮了，判错就是把用户关在错的那一边。
            因此只在「主指针是手指（pointer: coarse）」或「只有触屏、没有任何精确指针」时才当手机：
            触屏笔记本（有鼠标 = pointer: fine）不会被抢走；
            并且要求 innerWidth <= 1024，大屏触屏设备仍给电脑版。
            **绝不用窗口宽度单独判定** —— 那会把「窗口拉窄的电脑浏览器」弹进手机版（0.0.8 踩过）。
         出问题时（matchMedia 缺失、异常）一律留在电脑版。 */
      (function () {
        /* ⭐ 应用挂载前缀（0.3.5 统一网关改造）：飞牛统一网关把应用挂在系统域名的 /app/zxdesk 下，
           页面里的地址必须带上它。⚠️ 本页里的静态链接（样式表 / modulepreload）**一律写成相对路径** ——
           相对路径在 `/` 与 `/app/zxdesk/` 下都成立，而绝对路径 `/core/x.js` 在网关下会打到
           飞牛系统根目录（404 ⇒ 整页白屏）。JS 里的接口地址另有唯一出处：`core/api.js` 的 `BASE`。 */
        var base = location.pathname.replace(/[^/]*$/, '').replace(/\/$/, '');
        function cleanupLegacy() {
          // 旧版本的「已选电脑版」偏好键（0.0.8 中间版本写过），此版本起不再读写，顺手清掉
          try {
            localStorage.removeItem('zxdesk.view');
          } catch (e) {
            /* 存储不可用：无所谓，本来也不再依赖它 */
          }
        }
        var q = null;
        try {
          q = new URLSearchParams(location.search).get('view');
        } catch (e) {
          q = null;
        }
        cleanupLegacy();

        /* ⭐⭐ 2026-10-19：**跳去手机版时必须把地址上的查询串一起带走**（只摘掉 `view`）。
           现场：飞牛开「访问码」+ 走 FN Connect 中转时，手机端一直停在访问码输入界面，
           输对了也进不去（只有中继模式这样、电脑端正常）。
           根因就在这一行 —— 从前写的是 `base + '/mobile/' + location.hash`，
           **把 `location.search` 整个丢了**。飞牛网关会在入口地址上带自己的票据 / 标记
           （形如 `?xxx=…`），我们这一跳把它甩掉之后，网关认为「这一趟没带凭证」，
           于是又把访问码页顶出来 —— 用户看到的就是「输入对了还回到输入界面」。
           ⚠️ 中继模式比局域网更容易触发：中继那条链路上票据是**跟着地址走**的。
           ⛔ 别改回「只拼 hash」：那是本项目唯一一处会丢掉网关查询串的整页跳转。 */
        function carrySearch() {
          var s = String(location.search || '');
          if (!s) return '';
          try {
            var usp = new URLSearchParams(s);
            usp.delete('view'); // 我们自己的参数不往下一屏带
            var out = usp.toString();
            return out ? '?' + out : '';
          } catch (e) {
            return s; // 解析失败时原样带过去 —— 宁可多带，不可丢票据
          }
        }

        if (q === 'desktop') return; // ⭐ 应急出口最优先
        if (q === 'mobile') {
          location.replace(base + '/mobile/' + carrySearch() + location.hash);
          return;
        }
        var mm = window.matchMedia;
        var coarse = !!(mm && mm('(pointer: coarse)').matches);
        var fine = !!(mm && mm('(pointer: fine)').matches);
        var fingers = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
        var isPhone = coarse || (fingers && !fine);
        if (isPhone && window.innerWidth <= 1024) {
          location.replace(base + '/mobile/' + carrySearch() + location.hash);
        }
      })();
    </script>
    <!-- ⭐ 共用设计令牌（--zx-*）：必须在 desktop/app.css 之前（见 core/tokens.css 的说明）
         ⚠️ 资源地址**一律相对路径**（网关挂载前缀下绝对路径会打到系统根）—— 见上方引导脚本里的说明 -->
    <link rel="stylesheet" href="core/tokens.css" />
    <link rel="stylesheet" href="desktop/app.css" />
  </head>
  <body>
    <div id="app" class="app">
      <!-- 左侧栏：搜索 + 三个平级主导航（首页看板 / 项目任务 / 大学课表）+ 底部工具 -->
      <aside class="sidebar">
        <!-- ⭐ 0.7.6：主导航折叠开关（全局 —— 所有视图共用这一条侧栏）。
             收起只切 `#app` 上的 `collapsed` 类，⛔ **不摘任何节点**：`.sidebar` / `#nav-home` /
             `#project-list` 必须一直在（`module-ui.test.js` 与三个浏览器探针都按它们找节点）。
             ⚠️ 它是 `.sidebar` 的**直接子节点**、刻意放在 `.sidebar-head` **外面** ——
             折叠时 `.sidebar-head` / `#project-list` / `.sidebar-foot` 都要隐藏，
             开关若住在里面就会跟着被藏起来，那就再也点不回来了。
             ⚠️ id 与 class 都用外壳自己的名字（`side-toggle`）：⛔ 别写成 `nav-<模块名>` 那种形式
             （那会把 `module-ui.test.js` 的一条断言顶红，见 `desktop/shell.js` 里的同类说明）。
             箭头指向「点下去会往哪边走」：展开时 ‹（收起来）、收起时 ›（放出来）。 -->
        <button
          id="side-toggle"
          class="side-toggle"
          type="button"
          aria-expanded="true"
          aria-controls="project-list"
          title="收起主导航"
        >
          ‹
        </button>
        <div class="sidebar-head">
          <div class="brand">
            <span class="brand-logo">ZX</span>
            <span class="brand-name">ZXDesk工作台</span>
          </div>
          <!-- ⚠️ 下面这一格（以及全页其它文本框）是「防浏览器自动填充」的**静态骨架**（0.4.4 起，0.4.5 修正）：
               `autocomplete="off"` ＋ 中性 `name` ＋ 三家密码管理器的忽略标记 ＋ **初始 readonly**。
               ⛔ **别再写 `autocomplete="new-password"`** —— Chromium 的密码管理器按名字认这个值，
               写上去等于告诉它「这是密码框」，Edge 的「保存的密码」浮层就是这么被勾出来的（0.4.4 踩过）。
               解锁时机（键鼠 `keydown` / 触摸 `touchstart` / 失焦装回 readonly）与完整论证
               写在 `app.js` 的 `unlockAutofillGuards()` 里。
               ⛔ 别把 `readonly` 或 `data-autofill-guard` 写丢 —— 丢了就退回「搜索框里被灌进
 ZXDesk 登录用户名」的老毛病（报的）。 -->
          <div class="search-box">
            <span class="s-ico" aria-hidden="true">🔍</span>
            <input
              role="searchbox"
              name="q"
              id="search-input"
              type="search"
              placeholder="搜索任务 / 项目 / 标签（/）"
              autocomplete="off"
              data-autofill-guard
              data-lpignore="true"
              data-1p-ignore
              data-bwignore="true"
              readonly
            />
            <button id="search-clear" class="s-clear hidden" type="button" title="清除搜索">✕</button>
          </div>
        </div>
        <nav id="project-list" class="project-list nav-list" aria-label="主导航">
          <button id="nav-home" class="nav-item" type="button">
            <span class="ni-ico" aria-hidden="true">🧭</span>
            <span class="ni-main"><b>首页看板</b><small>今日待办 · 逾期 · 项目进度</small></span>
          </button>
          <button id="nav-projects" class="nav-item" type="button">
            <span class="ni-ico" aria-hidden="true">🗂</span>
            <span class="ni-main"><b>任务与随手记</b><small>选项目 · 看任务 · 记念头</small></span>
          </button>
               <!-- ⭐ 0.5.0 模块化重构：**模块入口不写在这里了** —— 由 `desktop/shell.js` 的
               `renderNavModules()` 按「服务端 `GET /api/bootstrap` 的 `modules` 清单 × 本端接线表
               `desktop/modules.js`」生成，插在 `#nav-projects` 后面（顺序 = `module.json` 的 `order`）。
               ⚠️ 所以「大学课表 / 网址/密码夹 / 数码管理 / 生活记账 / 个人资产管理 / …」这些按钮
               **全仓库只此一份数据源**：删掉 `app/modules/<模块>/` 那个目录，这里就自动少一颗按钮
               （不报错、也不留空壳）。
               ⛔ 别把按钮挪回静态 HTML —— 那样「删目录 ⇒ 界面少一个入口」立刻失效。
               ⚠️ 生成出来的 id 是接线表里写的那几个（`#btn-timetable` / `#nav-webpass` /
               `#btn-digital` / `#nav-assets` / `#nav-teamwork` …，浏览器探针按 id 找它们，见 ttt/tools/*.js）。 -->
        </nav>
        <!-- 手机版没有入口按钮：手机打开本页会被上面的引导脚本直接送去 /mobile/，电脑用户用不到 -->
        <div class="sidebar-foot">
          <button id="btn-refresh" class="btn btn-line foot-btn" title="重新读取数据库的数据">↻ 刷新</button>
          <!-- ⭐ 0.2.1：账号 / 成员 / 导出备份 三个入口全部收进「设置」，侧栏底部只留这一扇门 -->
          <button id="btn-settings" class="btn btn-primary foot-btn" title="设置（账号 / 成员 / 备份 / 课表）">
            ⚙ 设置
          </button>
        </div>
      </aside>

      <!-- 主体区 -->
      <main class="main">
        <!-- 数据层异常横幅（只读降级 / 读的不是数据库时才会出现） -->
        <div id="banner" class="banner hidden"></div>

        <!-- 首页汇总看板（⭐ 0.4.5 大改：区间切换 + 任务概览 + 具体事项 + 收藏夹/消息） -->
        <section id="home-view" class="view hidden">
          <div class="home-head">
            <div class="home-title">
              <span class="home-logo">📊</span>
 <!-- ⭐ 0.8.9：「三屏的切换药丸位置要统一，全部放到标题处 ——
                   已经是标题（了），不要了，直接显示切换药丸；字体大小和样式与原标题一样」。
                   ⇒ 原来的 `<h2>首页看板</h2>` **删掉**，药丸（本行最后那个槽）占它的位置。
                   ⚠️ 药丸仍是**静态骨架**（⛔ 不在 `#home-body` 里）：那块每画一次就被整个换掉，
                   而这条胶囊**两个视图下都得在**（列表 / 日历）。
                   ⚠️ 没视图可切（模块被删 / 接线表里没人声明 `dashView`）时它**空着**，
                   `.dash-tabs-row:empty` 会把占位收掉 —— 一颗死胶囊都不剩（删目录验收）。
                   ⚠️ 版本 / 数据状态挪去了「设置」标题旁（0.4.1 第五轮）；这里只放区间说明。 -->
              <div class="dash-tabs-row" id="home-tabs"></div>
            </div>
            <span id="home-date" class="home-date"></span>
          </div>
          <!-- ⭐ 区间切换条：**静态骨架**（与工具栏同一条规矩）——
               只有 `#home-body` 由 `views/home.js` 重画；两个 `<input type="date">` 若进重画范围，
               用户正在挑日期的那个原生选择器会被连根换掉。
               ⚠️ 预设按钮的 `data-dash` 与 `core/dashboard.js` 的 `DASH_PRESETS` 逐个对齐。
 ⭐ 0.8.9：「今日」那一颗**已删** —— 它与周条右上角的「今天」
               按钮重复（两颗都调 `dashSetPreset('today')`）。现在只剩「单日 / 本周 / 本月」三颗，
               「回到今天」一律走周条那颗「今天」（或直接点周条里今天那一格）。 -->
          <!-- ⭐ 0.5.5 区间条（周条）：一行「‹ 区间 › 今天」+ 一行 7 个日期格。
 「合并今日、单日、本周菜单（两端）：改为如图所示」。
               ⚠️ 与下面那套旧控件**驱动同一个 state**，所以必须双向同步：
               点格子会把档位切到「单日」、点档位按钮会把格子跟着挪 —— 见 `views/home.js` 的 `renderDashBar()`。
               两边不同步的表现是「顶部写着 9/14 ~ 9/20、格子亮着 9/15、下面的按钮亮着本月」，且不报任何错。
               ⚠️ 它同样是**静态骨架**：7 个格子是固定节点，只由 JS 改字与类名，不重建。 -->
          <div class="dash-week">
            <div class="dw-head">
              <button class="dw-nav" type="button" id="dash-prev" aria-label="上一周">‹</button>
              <span class="dw-range" id="dash-week-range"></span>
              <button class="dw-nav" type="button" id="dash-next" aria-label="下一周">›</button>
              <button class="dw-today" type="button" id="dash-go-today">今天</button>
 <!-- ⭐ 0.8.9：「这三个变为一个：筛选图标，点击筛选向下展开出
                   单日、本周、本月、自定义区间；还增加一个搜索图标（放大镜），点击出现输入框。
                   这两个图标放到【今天】的旁边」—— 两颗都住在周条的工具栏里。
                   ⚠️ 「筛选」那颗控制的是下面那条 `.dash-range`（单日 / 本周 / 本月 ＋ 两个日期框），
                   它从「常驻」改成「点开才显示」。显隐判据**统一在 `views/home.js` 的 `renderHome()`
                   里算**（视图维度与用户展开是两个来源，⛔ 别在 CSS 里各写一半）。
                   ⚠️ 两颗都用**线性 SVG**（与手机端同一套画法），⛔ 不用 emoji：它们要跟着文字色走。 -->
              <button class="dw-ico" type="button" id="dash-filter-btn" aria-label="筛选区间" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" /></svg>
              </button>
              <button class="dw-ico" type="button" id="dash-search-btn" aria-label="搜索" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" /><path d="M16 16l4 4" /></svg>
              </button>
            </div>
            <div class="dw-days" id="dash-week-days" role="group" aria-label="按天查看">
              <button class="dash-day" type="button" data-dash-day=""><i>一</i><b></b></button>
              <button class="dash-day" type="button" data-dash-day=""><i>二</i><b></b></button>
              <button class="dash-day" type="button" data-dash-day=""><i>三</i><b></b></button>
              <button class="dash-day" type="button" data-dash-day=""><i>四</i><b></b></button>
              <button class="dash-day" type="button" data-dash-day=""><i>五</i><b></b></button>
              <button class="dash-day" type="button" data-dash-day=""><i>六</i><b></b></button>
              <button class="dash-day" type="button" data-dash-day=""><i>日</i><b></b></button>
            </div>
          </div>
          <div class="dash-search" id="dash-search" hidden>
 <!-- ⭐ 0.8.9：放大镜点开就是这一行 —— 输入即筛（纯前端，
                 ⛔ 不重新取数：筛选是同一份数据上的事，见 `views/home.js` 的 `dashSearch`）。 -->
            <span class="ds-ico" aria-hidden="true">🔍</span>
            <input
              id="dash-q"
              name="q"
              type="search"
              placeholder="搜这段时间里的事项（标题 / 备注 / 归属）…"
              autocomplete="off"
              data-autofill-guard
              data-lpignore="true"
              data-1p-ignore
              data-bwignore="true"
            />
          </div>
          <div class="dash-range" hidden>
            <div class="segmented" id="dash-presets" role="tablist" aria-label="看板区间">
              <button class="seg-btn" type="button" role="tab" aria-selected="false" data-dash="day">单日</button>
              <button class="seg-btn" type="button" role="tab" aria-selected="false" data-dash="week">本周</button>
              <button class="seg-btn" type="button" role="tab" aria-selected="false" data-dash="month">本月</button>
            </div>
            <div class="dash-dates">
              <input id="dash-from" type="date" title="起始日期" aria-label="起始日期" />
              <span class="dash-dash">–</span>
              <input id="dash-to" type="date" title="截止日期" aria-label="截止日期" />
            </div>
            <span id="dash-range-note" class="dash-range-note"></span>
          </div>
 <!-- ⭐⭐ 0.8.61（「首页看板的电脑端你没有修改吗，没有变化，两端同步」）：
               **任务概览**的固定槽 —— 与手机端 `#today-stats` 逐字同构。
               它从前长在 `#home-body` 里，跟着清单一起滚走；而概览那五个数**本身就是筛选按钮**，
               滚没了等于筛选入口也没了。⇒ 搬进静态骨架，由 `views/home.js` 的 `renderStats()` 写。
               ⚠️ 它是**空槽**：数据没到 / 空工作台时写空串（`#home-stats:empty` 收掉占位，不留高度）。
               ⚠️ 它住在 `#home-body` **外面** ⇒ 不参与内容重画（那 5 颗按钮不会每次重画都被换掉）。 -->
          <div id="home-stats"></div>
          <div id="home-body" class="home-body"><!-- JS 渲染：具体事项 + 各模块（概览在 #home-stats） --></div>
 <!-- ⭐ 0.8.5：首页看板的悬浮「＋」—— 「电脑端的首页看板……的悬浮 +，
               点开出现 新建任务、记账、随手记」。
               ⚠️ 它挂在 section 上、**不在 `#home-body` 里**：`#home-body` 每画一次就被整个换掉，
               挂在里面等于每次重画都要重绑一次（漏一次就是「点了没反应」且不报错）。
               ⚠️ 菜单是**静态骨架**，`bindEvents()` 里只切 `.hidden`，⛔ 不重建节点。 -->
          <div class="home-new" id="home-new">
            <div class="home-new-menu hidden" id="home-new-menu" role="menu" aria-label="新建">
              <button class="hnm-item" type="button" role="menuitem" data-home-new="task">🗂 新建任务</button>
              <button class="hnm-item" type="button" role="menuitem" data-home-new="ledger">💰 记一笔</button>
              <button class="hnm-item" type="button" role="menuitem" data-home-new="idea">💡 随手记一条</button>
            </div>
            <button class="home-fab" type="button" id="home-fab" aria-haspopup="menu" aria-expanded="false" aria-label="新建">＋</button>
          </div>
        </section>

        <!-- 搜索结果 -->
        <section id="search-view" class="view hidden">
          <div class="home-head">
            <div class="home-title">
              <span class="home-logo">🔍</span>
              <h2>搜索结果</h2>
            </div>
            <span id="search-summary" class="home-date"></span>
          </div>
          <div id="search-body" class="search-body"><!-- JS 渲染 --></div>
        </section>

        <!-- ⭐ 0.4.5：原来的「项目任务」卡片屏（`#projects-view`）**已删除** ——
